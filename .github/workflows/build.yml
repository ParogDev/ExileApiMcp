# Builds the MCP server on the maintainer's self-hosted runner (label "hexile").
# Forks never run here: the job is skipped for fork PRs, and the runner supervisor
# independently refuses runs from forks.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hexile]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: dotnet build ExileApiMcp.csproj -c Release -nologo
