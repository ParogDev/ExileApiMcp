# Builds the MCP server on the maintainer's self-hosted runner (label "hexile").
# Forks never run here: the job is skipped for fork PRs, and the runner supervisor
# independently refuses runs from forks.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hexile]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: dotnet build ExileApiMcp.csproj -c Release -nologo

      # The MCP App UIs are built locally in a container (ui-src/build.ps1) and the single-file
      # outputs are committed as ui/*.html. Rebuild them here with the same Node version and
      # lockfile, and fail if a committed bundle doesn't match its source.
      - name: UI typecheck, build and freshness check
        working-directory: ui-src
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npm ci --no-audit --no-fund --no-progress
          npm run build
          for app in player-stats data-explorer memory-view hud-performance control-center; do
            if ! cmp -s "dist/$app.html" "../ui/$app.html"; then
              echo "::error file=ui/$app.html::Stale UI bundle: run ui-src/build.ps1 and commit ui/$app.html"
              exit 1
            fi
          done

      # Instructions, prompts, tool descriptions and packs point agents at knowledge packs by name
      # (e.g. "knowledge pack shared/api-costs"). Fail if one of those names has no pack.
      - name: Knowledge pack references resolve
        shell: bash
        run: |
          refs=$(grep -ohE "\b(shared|poe1|poe2)/[a-z][a-z0-9-]+" Hosting/McpSetup.cs Prompts/*.cs Tools/*.cs Knowledge/*/*.md README.md | grep -vE "^(shared|poe1|poe2)/(poe1|poe2)$" | sort -u)
          missing=0
          for r in $refs; do
            if [ ! -f "Knowledge/$r.md" ]; then echo "::error::knowledge pack '$r' is referenced but Knowledge/$r.md doesn't exist"; missing=1; fi
          done
          echo "$(echo $refs | wc -w) pack references checked"
          exit $missing
